# Запускайте из КОРНЯ репозитория (где лежит папка HomeMe/):
#   git pull
#   docker compose up -d --build
#
# Django-проект и Dockerfile — в ./HomeMe/ (не в корне репо).

services:
  db:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  web:
    build:
      context: ./HomeMe
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - 8000
    env_file:
      - ./HomeMe/.env
    environment:
      - RUN_MIGRATIONS=1
      - RUN_COLLECTSTATIC=1
    depends_on:
      - db
      - redis
    restart: always

  bot:
    build:
      context: ./HomeMe
      dockerfile: Dockerfile
    command: python manage.py run_tg_bot
    env_file:
      - ./HomeMe/.env
    environment:
      - RUN_MIGRATIONS=0
      - RUN_COLLECTSTATIC=0
    depends_on:
      - db
      - web
      - redis
    restart: always

  celery_worker:
    build:
      context: ./HomeMe
      dockerfile: Dockerfile
    command: celery -A HomeMe worker -l info
    env_file:
      - ./HomeMe/.env
    environment:
      - RUN_MIGRATIONS=0
      - RUN_COLLECTSTATIC=0
    depends_on:
      - db
      - redis
    restart: always

  celery_beat:
    build:
      context: ./HomeMe
      dockerfile: Dockerfile
    command: celery -A HomeMe beat -l info
    env_file:
      - ./HomeMe/.env
    environment:
      - RUN_MIGRATIONS=0
      - RUN_COLLECTSTATIC=0
    depends_on:
      - db
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./HomeMe/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
